name: Python CI

on:
  push:
    branches: [main, before-develop]
  pull_request:
    branches: [main, before-develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/unit --cov=rodiumai --cov-report=xml

      - name: Run integration tests
        run: pytest tests/integration --cov=rodiumai --cov-report=xml --cov-append

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: flake8
        run: flake8 rodiumai/ --max-line-length=100

      - name: black
        run: black --check --diff rodiumai/

      - name: isort
        run: isort --check-only --diff rodiumai/

      - name: mypy
        run: mypy rodiumai/

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: bandit — static security analysis
        run: bandit -r rodiumai/ -ll

      - name: pip-audit — dependency vulnerabilities
        run: pip-audit || true

      - name: Run security tests
        run: pytest tests/unit/test_security.py -v
