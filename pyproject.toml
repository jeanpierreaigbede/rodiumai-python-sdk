[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rodiumai"
version = "0.1.0"
description = "RodiumAI SDK — Unified AI API for Africa"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "RodiumAI", email = "dev@rodiumai.io" },
]
keywords = ["ai", "api", "africa", "llm", "openai-compatible"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "httpx>=0.25.0",
]

[project.urls]
Homepage = "https://rodiumai.io"
Documentation = "https://docs.rodiumai.io"
Source = "https://github.com/jeanpierreaigbede/rodiumai-python-sdk"
Issues = "https://github.com/jeanpierreaigbede/rodiumai-python-sdk/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "pytest-httpx>=0.30.0",
    "pytest-cov>=4.0",
    "flake8>=6.0",
    "black>=23.0",
    "mypy>=1.0",
    "isort>=5.0",
    "bandit>=1.7",
    "pip-audit>=2.0",
]

[tool.coverage.run]
branch = true
source = ["rodiumai"]

[tool.coverage.report]
fail_under = 98.5
skip_covered = true
show_missing = true

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.8"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.bandit]
exclude_dirs = ["tests"]
